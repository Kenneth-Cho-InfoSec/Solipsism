android.useAndroidX=true

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.unsafe.configuration-cache=false

android.nonTransitiveRClass=false
# Required by AGP's optimised R8 resource shrinking.
android.nonFinalResIds=true

kotlin.incremental=true

ksp.incremental=true
ksp.useKSP2=true

# Public certificate fingerprint for the separately installed Antares engine.
# Release builds use this to ensure that the embedded engine surface only comes
# from the companion package signed by the Solipsism release identity.
# Solipsism 9.3.1 rotated its release key; Antares 0.5.0 is signed with that
# identity (SHA-256 70:BC:99:...:34:BA).
antaresCertSha256=70BC99FE73E870353A34B2F36180B0053531A8FEA65A218B8300E50BC88034BA
