<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language"/>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
</head>
<style>
    :root {
        --body-bg: {COLOR}
        --box-bg: {COLOR}
        --box-txt: {COLOR}
    }

    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        color: #ffffff;
        background:
            linear-gradient(180deg, rgba(12, 18, 20, 0.16), rgba(12, 18, 20, 0.74)),
            url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1100&q=85")
            center center / cover no-repeat,
            var(--body-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        padding: 28px;
    }

    .home {
        width: 100%;
        max-width: 620px;
        padding-bottom: 12vh;
    }

    .kicker {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.86;
    }

    h1 {
        margin: 0;
        max-width: 12ch;
        font-size: 48px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: 0;
    }

    .subhead {
        max-width: 32ch;
        margin: 16px 0 28px;
        color: rgba(255, 255, 255, 0.86);
        font-size: 17px;
        line-height: 1.42;
    }

    .search_bar {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 56px;
        max-width: 560px;
        padding: 8px 10px 8px 16px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 28px;
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.24);
    }

    #image_url {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
    }

    #search_input {
        min-width: 0;
        width: 100%;
        height: 40px;
        outline: none;
        border: none;
        color: #17201d;
        background: transparent;
        font-size: 16px;
    }

    #search_submit {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        border: none;
        border-radius: 21px;
        color: #ffffff;
        background: #16211e;
        font-size: 18px;
        font-weight: 700;
    }

    @media (max-width: 480px) {
        .page {
            padding: 22px;
        }

        h1 {
            font-size: 38px;
        }

        .home {
            padding-bottom: 10vh;
        }
    }
</style>

<body>
<main class="page">
    <section class="home">
        <p class="kicker">Solipsism</p>
        <h1>Where to next?</h1>
        <p class="subhead">Search the web, jump to a site, or start with a clean view.</p>
        <form onsubmit="return search()" class="search_bar" autocomplete="off">
            <img id="image_url" src="${IMAGE}" alt="">
            <input class="search" type="text" value="" id="search_input" placeholder="Search or enter address"/>
            <input type="submit" id="search_submit" value="Go">
        </form>
    </section>
</main>
<script type="text/javascript">
        function search() {
            if (document.getElementById("search_input").value != "") {
                window.location.href = "${BASE_URL}" + document.getElementById("search_input").value;
                document.getElementById("search_input").value = "";
            }
            return false;
        }

</script>
</body>

</html>
