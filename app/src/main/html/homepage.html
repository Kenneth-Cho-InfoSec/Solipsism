<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language"/>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
</head>
<style>
    :root {
        --body-bg: {COLOR}
        --box-bg: {COLOR}
        --box-txt: {COLOR}
        --home-wallpaper: {WALLPAPER}
    }

    @font-face {
        font-family: "Google Sans Flex Offline";
        src: {GOOGLE_SANS_FONT};
        font-style: normal;
        font-weight: 500;
        font-display: swap;
    }

    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        color: #ffffff;
        background:
            linear-gradient(180deg, rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.76)),
            var(--home-wallpaper),
            var(--body-bg);
        font-family: "Google Sans", "Google Sans Medium", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 28px;
    }

    .shortcuts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        width: 100%;
        max-width: 720px;
        margin: 8px auto 0;
    }

    .shortcut {
        min-width: 0;
        min-height: 84px;
        padding: 12px 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 22px;
        background: rgba(18, 24, 24, 0.46);
        color: #ffffff;
        text-align: center;
        text-decoration: none;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
    }

    .shortcut_icon {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.20);
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
    }

    .shortcut_title {
        display: block;
        margin-top: 8px;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.92);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.18;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .home {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding-bottom: 10vh;
    }

    .browser_title {
        margin: 0;
        color: rgba(255, 255, 255, 0.94);
        font-family: "Google Sans Flex Offline", "Google Sans", "Google Sans Medium", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.12;
    }

    .motto {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.35;
    }

    @media (max-width: 480px) {
        .page {
            padding: 18px;
        }

        .shortcuts {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px;
        }

        .browser_title {
            font-size: 28px;
        }

        .home {
            padding-bottom: 8vh;
        }
    }
</style>

<body>
<main class="page">
    <nav id="bookmark_shortcuts" class="shortcuts">
        <a id="shortcut_template" class="shortcut" href="${URL}">
            <span id="shortcut_icon" class="shortcut_icon">S</span>
            <span id="shortcut_title" class="shortcut_title">${TITLE}</span>
        </a>
    </nav>
    <section class="home">
        <p class="browser_title">Solipism Browser</p>
        <p class="motto">Ex se sola veritas fluit</p>
    </section>
</main>
</body>

</html>
