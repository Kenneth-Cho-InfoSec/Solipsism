<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language"/>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${TITLE}</title>
</head>
<style>
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
    :root {
        --body-bg: {COLOR}
        --box-bg: {COLOR}
        --box-txt: {COLOR}
        --home-wallpaper: {WALLPAPER}
        --home-overlay: {HOME_OVERLAY}
        --home-text: {HOME_TEXT}
        --home-text-secondary: {HOME_TEXT_SECONDARY}
        --shortcut-text: {SHORTCUT_TEXT}
        --shortcut-border: {SHORTCUT_BORDER}
        --shortcut-bg: {SHORTCUT_BG}
        --shortcut-icon-bg: {SHORTCUT_ICON_BG}
        --homepage-datetime-opacity: {DATETIME_OPACITY}
        --homepage-motto-size: {MOTTO_SIZE}
        --homepage-motto-opacity: {MOTTO_OPACITY}
        --homepage-bookmark-columns: {BOOKMARK_COLUMNS}
        --homepage-wallpaper-opacity: {WALLPAPER_OPACITY}
        --homepage-wallpaper-position: {WALLPAPER_POSITION}
    }

    @font-face {
        font-family: "Google Sans Flex Offline";
        src: {GOOGLE_SANS_FONT};
        font-style: normal;
        font-weight: 500;
        font-display: swap;
    }

    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        color: var(--home-text);
        background: var(--body-bg);
        font-family: "Google Sans", "Google Sans Medium", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .homepage_wallpaper {
        position: fixed;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--homepage-wallpaper-position);
        opacity: var(--homepage-wallpaper-opacity);
    }

    .homepage_wallpaper_overlay {
        position: fixed;
        z-index: 1;
        inset: 0;
        background: var(--home-overlay);
        pointer-events: none;
    }

    .page {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 28px;
    }

    .shortcuts {
        display: grid;
        grid-template-columns: repeat(var(--homepage-bookmark-columns), minmax(0, 1fr));
        gap: 14px;
        width: 100%;
        max-width: 720px;
        margin: 8px auto 0;
    }

    .shortcut {
        min-width: 0;
        min-height: 84px;
        padding: 12px 10px;
        border: 1px solid var(--shortcut-border);
        border-radius: 22px;
        background: var(--shortcut-bg);
        color: var(--shortcut-text);
        text-align: center;
        text-decoration: none;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
    }

    .shortcut_icon {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 17px;
        background: var(--shortcut-icon-bg);
        color: var(--shortcut-text);
        font-size: 15px;
        font-weight: 500;
    }

    .shortcut_title {
        display: block;
        margin-top: 8px;
        overflow: hidden;
        color: var(--shortcut-text);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.18;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .home {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding-bottom: 10vh;
    }

    .browser_title {
        margin: 0;
        color: var(--home-text);
        font-family: "Google Sans Flex Offline", "Google Sans", "Google Sans Medium", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.12;
    }

    .homepage_datetime {
        margin: 0 0 6px;
        color: var(--home-text);
        font-family: "Google Sans Flex Offline", "Google Sans", "Google Sans Medium", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.2;
        opacity: var(--homepage-datetime-opacity);
    }

    .motto {
        margin: 8px 0 0;
        color: var(--home-text-secondary);
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: var(--homepage-motto-size);
        font-weight: 400;
        line-height: 1.35;
        opacity: var(--homepage-motto-opacity);
    }

    @media (max-width: 480px) {
        .page {
            padding: 18px;
        }

        .shortcuts {
            grid-template-columns: repeat(var(--homepage-bookmark-columns), minmax(0, 1fr));
            gap: 9px;
        }

        .browser_title {
            font-size: 28px;
        }

        .homepage_datetime {
            font-size: 14px;
        }

        .home {
            padding-bottom: 8vh;
        }
    }
</style>

<body>
<img class="homepage_wallpaper" src="{HOME_WALLPAPER_IMAGE}" alt="" aria-hidden="true">
<div class="homepage_wallpaper_overlay" aria-hidden="true"></div>
<main class="page">
    <nav id="bookmark_shortcuts" class="shortcuts">
        <a id="shortcut_template" class="shortcut" href="${URL}">
            <span id="shortcut_icon" class="shortcut_icon">S</span>
            <span id="shortcut_title" class="shortcut_title">${TITLE}</span>
        </a>
    </nav>
    <section class="home">
        <p id="homepage_datetime" class="homepage_datetime">{DATETIME_INITIAL}</p>
        <p class="browser_title">Solipsism Browser</p>
        <p class="motto">Ex se sola veritas fluit</p>
    </section>
</main>
<script>
    (function () {
        const timePattern = {TIME_FORMAT};
        const datePattern = {DATE_FORMAT};
        const dateTime = document.getElementById("homepage_datetime");
        if (!dateTime || !timePattern || !datePattern) return;

        const pad = value => String(value).padStart(2, "0");
        const format = (date, pattern) => pattern.replace(
            /yyyy|yy|EEEE|EEE|MMMM|MMM|dd|d|HH|H|hh|h|mm|ss|a|MM|M/g,
            token => {
                switch (token) {
                    case "yyyy": return String(date.getFullYear());
                    case "yy": return String(date.getFullYear()).slice(-2);
                    case "MMMM": return new Intl.DateTimeFormat(undefined, { month: "long" }).format(date);
                    case "MMM": return new Intl.DateTimeFormat(undefined, { month: "short" }).format(date);
                    case "MM": return pad(date.getMonth() + 1);
                    case "M": return String(date.getMonth() + 1);
                    case "dd": return pad(date.getDate());
                    case "d": return String(date.getDate());
                    case "EEEE": return new Intl.DateTimeFormat(undefined, { weekday: "long" }).format(date);
                    case "EEE": return new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(date);
                    case "HH": return pad(date.getHours());
                    case "H": return String(date.getHours());
                    case "hh": return pad((date.getHours() % 12) || 12);
                    case "h": return String((date.getHours() % 12) || 12);
                    case "mm": return pad(date.getMinutes());
                    case "ss": return pad(date.getSeconds());
                    case "a": return date.getHours() < 12 ? "AM" : "PM";
                    default: return token;
                }
            }
        );

        const update = () => {
            const now = new Date();
            dateTime.textContent = format(now, timePattern) + "  •  " + format(now, datePattern);
        };
        update();
        window.setInterval(update, 60000);
    })();
</script>
</body>

</html>
