<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screenshot Studio | Solipsism</title>
<style>
@font-face{font-family:GoogleSans;src:url("../../app/src/main/assets/fonts/google_sans_flex_500.ttf") format("truetype");font-display:swap}
:root{color-scheme:dark;--bg:#101a18;--surface:#202b29;--surface2:#182320;--rail:#050707;--ink:#f4fffb;--muted:#b9d5ce;--accent:#8de2d5;--accentInk:#003833;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light;--bg:#f3f1f7;--surface:#e5dfeb;--surface2:#fcf9ff;--rail:#fbf9fd;--ink:#1d1b20;--muted:#625b68;--accent:#7155a4;--accentInk:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:GoogleSans,system-ui,sans-serif}button{font:inherit;cursor:pointer}.studio{min-height:100dvh;background:var(--bg)}.main{min-width:0;padding:max(24px,env(safe-area-inset-top)) clamp(16px,5vw,64px) max(30px,env(safe-area-inset-bottom));overflow:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{margin:0 0 5px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.title{margin:0;font-size:clamp(34px,6vw,56px);letter-spacing:-.065em;line-height:.98}.top-actions{display:flex;gap:8px}.icon{display:grid;width:46px;height:46px;place-items:center;border:0;border-radius:18px;background:var(--surface);color:var(--ink);font-size:22px}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:24px;align-items:start}.preview-card,.action-card{border-radius:32px;background:var(--surface)}.preview-card{padding:16px}.label{display:flex;justify-content:space-between;margin:0 4px 13px;color:var(--muted);font-size:13px}.preview{position:relative;display:grid;min-height:420px;place-items:center;border-radius:24px;background:#080b0a;overflow:hidden;touch-action:none}.preview img{width:100%;max-height:520px;object-fit:contain}.draw-layer{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.hint{position:absolute;bottom:14px;padding:9px 12px;border-radius:14px;background:#000b;color:#fff;font-size:12px;pointer-events:none}.meta{display:flex;justify-content:space-between;gap:10px;margin:12px 2px 0;color:var(--muted);font-size:12px}.panel{display:grid;gap:14px}.action-card{padding:18px}.primary,.secondary{display:flex;width:100%;min-height:58px;align-items:center;justify-content:center;gap:9px;border:0;border-radius:27px}.primary{background:var(--accent);color:var(--accentInk);font-weight:750}.secondary{border:1px solid #fff3;background:transparent;color:var(--ink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:22px;padding:14px 18px;border-radius:18px;background:var(--ink);color:var(--bg);opacity:0;transform:translate(-50%,12px);transition:.25s var(--ease);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){.layout{grid-template-columns:1fr}.preview{min-height:300px}}@media(max-width:520px){.main{padding-left:13px;padding-right:13px}.preview{min-height:260px}.toast{max-width:calc(100% - 28px);white-space:nowrap}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="studio"><section class="main">
<header class="topbar"><div><p class="eyebrow">Solipsism Browser</p><h1 class="title">Screenshot Studio</h1></div><div class="top-actions"><button class="icon" id="theme" aria-label="Toggle theme">☼</button><button class="icon" id="close" aria-label="Close studio">×</button></div></header>
<div class="layout"><section class="preview-card"><p class="label"><span>Captured just now</span><span>PNG · 1.8 MB</span></p><div class="preview" id="preview"><img src="../../website/public/assets/solipsism-browser-screenshot.jpeg" alt="Captured Solipsism Browser screen"><canvas class="draw-layer" id="draw" aria-label="Draw a circle around the area to search"></canvas><div class="hint" id="hint">Draw a circle around anything to search</div></div><div class="meta"><span>1080 × 2400 px</span><span>Circle an area, then choose Search</span></div></section>
<aside class="panel"><section class="action-card"><div class="actions"><button class="primary" id="save">↓ &nbsp;Save image</button><button class="secondary" id="search">⌕ &nbsp;Search</button></div></section></aside></div>
</section></main><div class="toast" id="toast" role="status"></div>
<script>
const toast=document.getElementById('toast'),preview=document.getElementById('preview'),hint=document.getElementById('hint'),canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');let drawing=false,hasCircle=false;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),2200)}function resize(){const r=preview.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function start(e){drawing=true;hasCircle=true;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId);hint.textContent='Release when the circle is complete'}function move(e){if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}function end(){if(drawing){drawing=false;hint.textContent='Circle ready. Choose Search'}}
document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'':'light';document.getElementById('save').onclick=()=>say('Screenshot saved to Pictures / Solipsism');document.getElementById('search').onclick=()=>say(hasCircle?'Searching the circled image with Google':'Draw a circle around an image first');window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);resize();
</script></body></html>
