<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solipsism utility surfaces</title>
  <style>
    @font-face{font-family:GoogleSans;src:url("../../app/src/main/assets/fonts/google_sans_flex_500.ttf") format("truetype");font-weight:400 800;font-display:swap}
    :root{color-scheme:dark;--page:#101a18;--surface:#202b29;--surface-2:#17221f;--rail:#050707;--rail-control:#202a29;--ink:#f4fffb;--muted:#bed7d1;--accent:#8de2d5;--accent-ink:#003833;--selected:#006f68;--line:rgba(220,245,238,.12);--ease:cubic-bezier(.2,.8,.2,1)}
    :root[data-theme=light]{color-scheme:light;--page:#f3f1f7;--surface:#e7e2ed;--surface-2:#faf8fc;--rail:#fbf9fd;--rail-control:#ece7f1;--ink:#1d1b20;--muted:#5f5965;--accent:#7155a4;--accent-ink:#fff;--selected:#0b756d;--line:rgba(34,26,45,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:var(--rail);color:var(--ink);font-family:GoogleSans,system-ui,sans-serif}button,input{font:inherit}.browser-frame{display:grid;grid-template-columns:minmax(0,1fr) 158px;min-height:100dvh;overflow:hidden}.page{min-width:0;background:var(--page);transition:background .35s var(--ease)}.page-content{min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom))}
    .surface-head{display:grid;grid-template-columns:72px minmax(0,1fr) 54px;align-items:center;gap:18px;margin:0 18px 24px;padding:25px 20px;border-radius:40px 40px 40px 12px;background:var(--surface);transition:border-radius .4s var(--ease),transform .3s var(--ease)}.surface-head:hover{border-radius:28px 40px 28px 40px;transform:translateY(-1px)}.head-icon{display:grid;width:58px;height:58px;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--selected) 42%,var(--surface));color:var(--ink);font-size:29px}.head-title{margin:0;font-size:clamp(28px,5vw,39px);font-weight:650;letter-spacing:-.055em;line-height:1}.head-action{display:grid;width:52px;height:52px;place-items:center;border:0;border-radius:17px 26px 17px 26px;background:transparent;color:var(--ink);font-size:39px;line-height:1;cursor:pointer;transition:background .25s var(--ease),border-radius .25s var(--ease)}.head-action:hover,.head-action:focus-visible{background:color-mix(in srgb,var(--accent) 25%,transparent);border-radius:26px 17px 26px 17px}
    .view-switch{display:flex;gap:8px;align-items:center;padding:0 30px 17px}.view-switch button{border:0;border-radius:18px 18px 18px 7px;background:transparent;color:var(--muted);padding:11px 15px;cursor:pointer;font-weight:650}.view-switch button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-radius:18px 7px 18px 18px}.toolbar{display:flex;gap:10px;align-items:center;padding:0 30px 18px;flex-wrap:wrap}.primary{min-height:50px;padding:0 22px;border:0;border-radius:27px 27px 27px 10px;background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;transition:transform .25s var(--ease),border-radius .25s var(--ease)}.primary:hover{transform:translateY(-2px);border-radius:16px 27px 16px 27px}.search{flex:1;min-width:190px;min-height:48px;padding:0 17px;border:1px solid var(--line);border-radius:17px;background:var(--surface-2);color:var(--ink);outline:0}.search:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent)}
    .rows{display:grid;gap:5px;padding:0 18px}.row{display:grid;grid-template-columns:58px minmax(0,1fr) 48px;align-items:center;gap:18px;min-height:93px;padding:13px 18px;border-radius:34px 34px 34px 11px;background:transparent;opacity:0;transform:translateY(9px);animation:in .45s var(--ease) forwards;animation-delay:calc(var(--i)*40ms);transition:background .25s var(--ease),border-radius .25s var(--ease),transform .25s var(--ease)}.row:hover{background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:24px 34px 24px 34px}.row.selected{background:var(--selected);color:#f5fffb;border-radius:38px 38px 38px 13px}.row-icon{display:grid;width:48px;height:48px;place-items:center;border-radius:50%;font-size:27px}.row-icon.globe{font-size:31px}.row-icon.star{font-size:29px}.row-title{overflow:hidden;margin:0;font-size:clamp(18px,2.8vw,25px);font-weight:560;letter-spacing:-.035em;text-overflow:ellipsis;white-space:nowrap}.row-url{overflow:hidden;margin:4px 0 0;color:var(--muted);font-size:13px;text-overflow:ellipsis;white-space:nowrap}.selected .row-url{color:#c7f2ec}.row-close{display:grid;width:44px;height:44px;place-items:center;border:0;border-radius:50%;background:transparent;color:inherit;font-size:34px;cursor:pointer}.row-close:hover,.row-close:focus-visible{background:color-mix(in srgb,#fff 20%,transparent)}.row.removing{opacity:0;transform:translateX(-110%)}.empty{display:none;padding:50px 30px;color:var(--muted);text-align:center}.empty.show{display:block}
    .settings-note{margin:25px 30px 0;padding:17px 18px;border-left:3px solid var(--accent);border-radius:5px 20px 20px 5px;background:color-mix(in srgb,var(--surface) 55%,transparent);color:var(--muted);font-size:13px;line-height:1.45}.settings-note strong{color:var(--ink)}
    .rail{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:100dvh;padding:max(36px,env(safe-area-inset-top)) 12px max(25px,env(safe-area-inset-bottom));background:var(--rail);color:#fff}.rail-top,.rail-bottom{display:grid;justify-items:center;gap:21px}.rail-tab{display:grid;width:60px;height:60px;place-items:center;border:2px solid currentColor;border-radius:19px;background:transparent;font-size:25px}.rail-control{display:grid;width:64px;height:64px;place-items:center;border:0;border-radius:50%;background:var(--rail-control);color:inherit;font-size:30px;cursor:pointer}.rail-utility{position:relative;display:grid;width:64px;height:146px;place-items:center;border:0;border-radius:34px;background:var(--rail-control);color:inherit;font-size:30px;cursor:pointer}.rail-utility span{position:absolute;bottom:17px;font-size:22px}.rail-nav{display:grid;gap:18px}.rail-nav button,.rail-home,.rail-more{border:0;background:transparent;color:inherit;cursor:pointer;font-size:38px;line-height:1}.rail-home{font-size:37px}.rail-more{font-size:30px}.toast{position:fixed;right:178px;bottom:18px;padding:14px 18px;border-radius:17px 25px 17px 25px;background:var(--ink);color:var(--page);opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}.toast.show{opacity:1;transform:translateY(0)}
    @keyframes in{to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.browser-frame{grid-template-columns:minmax(0,1fr) 112px}.rail{padding-left:8px;padding-right:8px}.rail-control,.rail-utility,.rail-tab{transform:scale(.84)}.rail-nav button{font-size:32px}.surface-head{margin-left:12px;margin-right:12px;grid-template-columns:58px minmax(0,1fr) 48px;padding-left:15px;padding-right:13px}.view-switch,.toolbar{padding-left:18px;padding-right:18px}.rows{padding:0 12px}.row{grid-template-columns:47px minmax(0,1fr) 42px;gap:12px;padding-left:12px;padding-right:10px}.row-icon{width:42px;height:42px}.toast{right:128px;max-width:calc(100% - 145px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    /* Rounded rectangles keep the interface calm and remove the previous speech-bubble corners. */
    .surface-head,.surface-head:hover{border-radius:32px}.head-action{border-radius:18px}.view-switch button,.view-switch button[aria-selected=true]{border-radius:18px}.primary,.primary:hover{border-radius:26px}.row,.row:hover{border-radius:30px}.row.selected{border-radius:30px;background:transparent;color:var(--ink)}.row.selected .row-url{color:var(--muted)}
  </style>
</head>
<body>
<main class="browser-frame"><section class="page" aria-label="Solipsism utility page"><div class="page-content">
  <header class="surface-head"><div class="head-icon" aria-hidden="true">☷</div><h1 class="head-title" id="title">Tabs</h1><button class="head-action" id="add" type="button" aria-label="Open a new tab">+</button></header>
  <nav class="view-switch" role="tablist" aria-label="Utility surfaces"><button role="tab" id="tabs-view" aria-selected="true" type="button">Tabs</button><button role="tab" id="history-view" aria-selected="false" type="button">History</button><button role="tab" id="downloads-view" aria-selected="false" type="button">Downloads</button></nav>
  <div class="toolbar"><button class="primary" id="clear" type="button">Clear all tabs</button><input class="search" id="search" type="search" placeholder="Search tabs" aria-label="Search tabs"></div>
  <section class="rows" id="rows" aria-live="polite"></section><p class="empty" id="empty">Nothing matches this view.</p>
  <p class="settings-note"><strong>Settings surface mirrored from the app</strong><br>General, Display, Privacy, Accessibility, Audio, Haptics, Ad blocking, Malware Scanner and Userscripts are grouped as independent settings categories. Rail utility action, rail position and rail size live in Display.</p>
</div></section><aside class="rail" aria-label="Solipsism rail"><div class="rail-top"><div class="rail-tab" aria-label="Five open tabs">5</div><button class="rail-control" type="button" aria-label="Refresh">↻</button><button class="rail-utility" type="button" aria-label="QR scanner">⌗<span>⌗</span></button></div><div class="rail-bottom"><nav class="rail-nav" aria-label="Browser navigation"><button type="button" aria-label="Back">←</button><button type="button" aria-label="Forward">→</button></nav><button class="rail-home" type="button" aria-label="Home">⌂</button><button class="rail-more" type="button" aria-label="More options">⋮</button></div></aside></main><div class="toast" id="toast" role="status"></div>
<script>
const tabs=[['Homepage','Homepage','globe'],['小薯茄方向愈行愈錯 | LIHKG','lihkg.com/thread/4142738/page/1','star'],['row and column - Google Search','google.com/search?client=solipsism','star'],['Homepage','Homepage','globe'],['row and column - Google Search','google.com/search?client=solipsism&sca_esv=bc9dbc','google']];
const history=[['row and column - Google Search','https://www.google.com/search?client=solipsism','Today · 21:14'],['小薯茄方向愈行愈錯 | LIHKG','https://lihkg.com/thread/4142738/page/1','Yesterday · 19:42'],['LIHKG 討論區','https://lihkg.com/','Mon · 18:22']];
const downloads=[['IMG_2026-08-08.jpg','3.4 MB · JPEG image','Today · 19:31'],['travel-itinerary-2026-08-08.pdf','1.2 MB · PDF document','Today · 20:47']];
const requestedView=new URLSearchParams(location.search).get('view');
const state={view:['tabs','history','downloads'].includes(requestedView)?requestedView:'tabs',query:''}, rows=document.getElementById('rows'), empty=document.getElementById('empty'), title=document.getElementById('title'), clear=document.getElementById('clear'), search=document.getElementById('search'), toast=document.getElementById('toast');
function say(message){toast.textContent=message;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),2100)}
function icon(kind){return kind==='globe'?'◉':kind==='google'?'G':kind==='star'?'✳':'◌'}
function render(){let source=state.view==='tabs'?tabs:state.view==='history'?history:downloads;let q=state.query.toLowerCase();let visible=source.map((item,index)=>({item,index})).filter(({item})=>item.join(' ').toLowerCase().includes(q));title.textContent=state.view[0].toUpperCase()+state.view.slice(1);clear.textContent=state.view==='tabs'?'Close all tabs':state.view==='history'?'Clear all history':'Clear download history';search.placeholder='Search '+state.view;rows.innerHTML=visible.map(({item,index},position)=>`<article class="row${state.view==='tabs'&&position===4?' selected':''}" data-index="${index}" style="--i:${position}"><div class="row-icon ${item[2]||''}">${state.view==='tabs'?icon(item[2]):'•'}</div><div><h2 class="row-title">${item[0]}</h2><p class="row-url">${item[1]}</p></div><button class="row-close" type="button" aria-label="Remove ${item[0]}">×</button></article>`).join('');empty.classList.toggle('show',!visible.length);rows.querySelectorAll('.row-close').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();let src=state.view==='tabs'?tabs:state.view==='history'?history:downloads;let i=Number(b.closest('.row').dataset.index);src.splice(i,1);say('Removed entry');render()}));rows.querySelectorAll('.row').forEach(row=>{row.addEventListener('click',e=>{if(!e.target.closest('button')){rows.querySelectorAll('.row').forEach(r=>r.classList.remove('selected'));row.classList.add('selected')}});installSwipe(row)})}
function installSwipe(row){let x=0,y=0;row.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x=e.clientX;y=e.clientY});row.addEventListener('pointerup',e=>{let dx=e.clientX-x,dy=e.clientY-y;if(dx< -64&&Math.abs(dx)>Math.abs(dy)){row.classList.add('removing');setTimeout(()=>{let src=state.view==='tabs'?tabs:state.view==='history'?history:downloads;src.splice(Number(row.dataset.index),1);say('Removed entry');render()},220)}})}
function setView(view){state.view=view;document.querySelectorAll('.view-switch button').forEach(b=>b.setAttribute('aria-selected',b.id===view+'-view'));render()}
document.getElementById('tabs-view').onclick=()=>setView('tabs');document.getElementById('history-view').onclick=()=>setView('history');document.getElementById('downloads-view').onclick=()=>setView('downloads');search.oninput=e=>{state.query=e.target.value;render()};clear.onclick=()=>say((state.view==='tabs'?'Tabs':state.view==='history'?'History':'Downloads')+' cleared in prototype');document.getElementById('add').onclick=()=>say('New tab created in prototype');document.querySelector('.rail-control').onclick=()=>say('Refreshed');setView(state.view);
</script></body></html>
